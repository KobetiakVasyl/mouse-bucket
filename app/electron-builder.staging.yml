# Staging installers: the production config with staging's own identity. See docs/ENVIRONMENTS.md.
extends: ./electron-builder.yml
appId: io.github.kobetiakvasyl.mousebucket.staging
productName: MouseBucket Staging
extraMetadata:
  name: mousebucket-staging
win:
  executableName: MouseBucket Staging
nsis:
  artifactName: MouseBucket-Staging-${version}-setup.${ext}
appImage:
  artifactName: MouseBucket-Staging-${version}.${ext}
# Staging updates from its own pre-releases: staging.yml, not production's latest.yml.
publish:
  provider: github
  owner: KobetiakVasyl
  repo: mouse-bucket
  channel: staging
  releaseType: prerelease
